name: CI pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  
jobs:
  build-and-check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: exactafit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup do node.jobs
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
        
      - name: Instalar dependencias
        run: npm ci 

      - name: Gerar prisma client
        run: npx prisma generate

      - name: Checagem de tipos
        run: npx tsc --noEmit
      
      - name: Linter
        run: npm run lint
      
      - name: Executar Migrations no CI
        env:
          DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/exactafit_test?schema=public"
          JWT_SECRET: "svfqWsJ+8TlLeWzTI5C0bRIFkDepy6gcXsxduW5tVrA="
        run: npx prisma migrate deploy

      - name: Rodar Testes E2E
        env:
          DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/exactafit_test?schema=public"
          JWT_SECRET: "svfqWsJ+8TlLeWzTI5C0bRIFkDepy6gcXsxduW5tVrA="
        run: npm run test:e2e
