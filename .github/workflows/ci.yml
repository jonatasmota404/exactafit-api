name: CI pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-and-check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: exactafit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup do node.jobs
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
        
      - name: Instalar dependencias
        run: npm ci 

      - name: Gerar prisma client
        run: npx prisma generate

      - name: Checagem de tipos
        run: npm run typecheck
      
      - name: Linter
        run: npm run lint:check

      - name: Testes unitários
        run: npm test

      - name: Testes dos hooks
        run: node --test '.claude/hooks/*.test.mjs'

      - name: Executar Migrations no CI
        env:
          DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/exactafit_test?schema=public"
          JWT_SECRET: "ci-only-fake-jwt-secret-not-a-real-secret"
        run: npx prisma migrate deploy

      - name: Rodar Testes E2E
        env:
          DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/exactafit_test?schema=public"
          JWT_SECRET: "ci-only-fake-jwt-secret-not-a-real-secret"
        run: npm run test:e2e
